<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>HemoVet</title><script src="https://unpkg.com/react@18/umd/react.production.min.js"></script><script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:sans-serif;background:#f8fafc}</style></head><body><div id="root"></div><script type="text/babel">
const {useState}=React;
const USERS=[{login:"gabrielle",senha:"123456",nome:"Gabrielle"}];
function App(){
const [user,setUser]=useState(null);
const [loginV,setLoginV]=useState("");
const [senhaV,setSenhaV]=useState("");
const [err,setErr]=useState("");
const doLogin=()=>{
const u=USERS.find(x=>x.login===loginV.trim()&&x.senha===senhaV);
if(u)setUser(u);else setErr("Login ou senha incorretos.");
};
if(!user)return(<div style={{minHeight:"100vh",background:"linear-gradient(135deg,#0f172a,#1e1b4b)",display:"flex",alignItems:"center",justifyContent:"center",padding:20}}><div style={{background:"#fff",borderRadius:24,padding:40,width:"100%",maxWidth:380,textAlign:"center"}}><div style={{fontSize:48,marginBottom:16}}>🩸</div><h1 style={{fontSize:24,fontWeight:900,marginBottom:4}}>HemoVet</h1><p style={{color:"#64748b",marginBottom:28}}>Banco de Sangue Animal</p><div style={{marginBottom:16,textAlign:"left"}}><label style={{fontSize:12,fontWeight:700,color:"#64748b",textTransform:"uppercase",display:"block",marginBottom:6}}>Login</label><input style={{width:"100%",padding:"11px 14px",borderRadius:10,border:"1.5px solid #e2e8f0",fontSize:15,boxSizing:"border-box"}} value={loginV} onChange={e=>setLoginV(e.target.value)} placeholder="gabrielle"/></div><div style={{marginBottom:20,textAlign:"left"}}><label style={{fontSize:12,fontWeight:700,color:"#64748b",textTransform:"uppercase",display:"block",marginBottom:6}}>Senha</label><input style={{width:"100%",padding:"11px 14px",borderRadius:10,border:"1.5px solid #e2e8f0",fontSize:15,boxSizing:"border-box"}} type="password" value={senhaV} onChange={e=>setSenhaV(e.target.value)} placeholder="123456"/></div>{err&&<div style={{color:"#dc2626",marginBottom:14,background:"#fef2f2",borderRadius:8,padding:"8px 12px",fontSize:13}}>{err}</div>}<button onClick={doLogin} style={{width:"100%",padding:13,background:"#dc2626",color:"#fff",border:"none",borderRadius:11,fontWeight:700,fontSize:15,cursor:"pointer"}}>Entrar</button><p style={{marginTop:14,fontSize:12,color:"#64748b"}}>Login: gabrielle · Senha: 123456</p></div></div>);
return(<div style={{fontFamily:"sans-serif",background:"#f8fafc",minHeight:"100vh",paddingBottom:72}}><header style={{background:"#0f172a",padding:"16px 20px",display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,zIndex:40}}><div style={{color:"#fff",fontWeight:900,fontSize:16}}>🩸 HemoVet</div><button onClick={()=>setUser(null)} style={{background:"#1e293b",border:"none",borderRadius:8,color:"#94a3b8",padding:"6px 12px",fontSize:12,cursor:"pointer"}}>Sair</button></header><div style={{padding:20,textAlign:"center",marginTop:40}}><div style={{fontSize:48,marginBottom:16}}>✅</div><h2 style={{fontSize:22,fontWeight:900,color:"#0f172a",marginBottom:8}}>App funcionando!</h2><p style={{color:"#64748b",fontSize:14}}>Logado como {user.nome}</p></div></div>);
}
const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script></body></html>
